<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bombilla: cúpula ancha (óvalo/semi-circle), cuello marcado, flare en la base del cristal -->
  <path d="
    M 12 2.2
    C 17 2.2 20.5 5.5 20.5 8.5
    C 20.5 11.5 18.8 13.6 17 14.8
    C 17.5 16 17.6 17 17.2 17.7
    L 6.8 17.7
